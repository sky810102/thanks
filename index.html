<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리집 감사일기</title>
<meta name="apple-mobile-web-app-title" content="감사일기">
<meta name="application-name" content="감사일기">
<meta name="theme-color" content="#03C75A">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: #03C75A; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 0 24px; text-align: center; }
  img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
  h1 { font-size: 1.4rem; margin: 0; letter-spacing: -0.02em; }
  p { margin: 0; opacity: .85; }
  [hidden] { display: none !important; }
  #guide, .box { background: rgba(255,255,255,.14); border-radius: 18px; padding: 16px 18px; max-width: 340px; text-align: left; line-height: 1.6; }
  .box p { opacity: 1; } .box p + p { margin-top: 8px; }
  #guide ul { margin: 10px 0; padding-left: 18px; }
  .btn { display: inline-block; background: #fff; color: #02964A; font-weight: 800; text-decoration: none; padding: 14px 28px; border-radius: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <img src="apple-touch-icon.png" alt="">
  <h1>우리집 감사일기</h1>
  <p id="state">여는 중…</p>
  <div id="kakao" class="box" hidden>
    <p>사파리나 크롬으로 다시 여는 중이에요.</p>
    <p>화면이 그대로면 카카오톡 화면의 <b>⋯</b>(아이폰은 오른쪽 아래, 안드로이드는 오른쪽 위) 버튼을 누르고 <b>다른 브라우저로 열기</b>를 눌러 주세요.</p>
  </div>
  <div id="guide" class="box" hidden>
    <p>처음 한 번만, 이 화면을 홈 화면에 추가해 주세요.</p>
    <ul>
      <li><b>아이폰</b>: 아래쪽 공유 버튼 → 홈 화면에 추가</li>
      <li><b>안드로이드</b>: 오른쪽 위 ⋮ 메뉴 → 홈 화면에 추가</li>
    </ul>
    <p>다음부터는 아이콘을 누르면 바로 열려요.</p>
  </div>
  <a id="go" class="btn" href="#">감사일기 열기</a>
</div>
<script>
  // ▼ Apps Script 웹 앱 주소(…/exec)로 바꿔 주세요.
  var APP_URL = 'https://script.google.com/macros/s/AKfycbxwfKfn_ZLoQA35Y6NwsllWfd97DiTKNFTiiiR9WuY25u86PXwFRR7BPsIqPzt2B-sPVg/exec';

  document.getElementById('go').href = APP_URL;
  // 카카오톡 안에서 열렸으면 기본 브라우저(사파리·크롬)로 다시 열기
  // (카카오톡 안에서는 홈 화면 추가가 제대로 되지 않기 때문)
  var inKakao = /KAKAOTALK/i.test(navigator.userAgent);
  if (inKakao) {
    location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
    document.getElementById('state').hidden = true;
    document.getElementById('kakao').hidden = false;
  }

  var seen = false;
  try { seen = localStorage.getItem('installed') === 'Y'; localStorage.setItem('installed', 'Y'); } catch (e) {}

  if (inKakao) {
    // 위에서 처리
  } else if (APP_URL.indexOf('여기에') >= 0) {
    document.getElementById('state').textContent = 'index.html 안의 APP_URL을 웹 앱 주소로 바꿔 주세요.';
  } else if (!seen) {
    // 처음 연 휴대폰: 바로 넘어가지 않고 홈 화면 추가 방법을 보여 줌
    document.getElementById('state').hidden = true;
    document.getElementById('guide').hidden = false;
  } else {
    setTimeout(function () { location.replace(APP_URL); }, 300);
  }
</script>
</body>
</html>
